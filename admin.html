<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Orders · House of Qi</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#F0E0D3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/page.css?v=2">
<link rel="stylesheet" href="/assets/css/admin.css?v=1">
</head>
<body>
<div class="wrap admin">
  <header>
    <a class="brand" href="/"><span class="mark" aria-hidden="true"></span><b>House of Qi</b></a>
    <span class="head-r"><span class="mode" id="mode" hidden>Test mode</span><button class="link" id="logout" hidden>Log out</button></span>
  </header>

  <section id="loginView" hidden>
    <h1>Orders</h1>
    <p class="lede">Log in to see and update shop orders.</p>
    <form id="loginForm" class="login" autocomplete="on">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Log in</button>
      <p class="err" id="loginErr" hidden></p>
    </form>
  </section>

  <section id="setupView" hidden>
    <h1>Orders</h1>
    <p>The order page isn't switched on yet. In Cloudflare, open the <b>house-of-qi</b> project → <b>Settings → Variables and secrets</b>, add a <b>Secret</b> named <code>ADMIN_PASSWORD</code>, then redeploy.</p>
  </section>

  <section id="ordersView" hidden>
    <div class="titlebar"><h1>Orders</h1><button class="link" id="refresh">Refresh</button></div>
    <nav class="filters" id="filters" aria-label="Filter orders">
      <button data-f="todo" class="on">To pack <i id="c-todo">0</i></button>
      <button data-f="packed">Packed <i id="c-packed">0</i></button>
      <button data-f="done">Sent <i id="c-done">0</i></button>
      <button data-f="all">All <i id="c-all">0</i></button>
    </nav>
    <div id="list" aria-live="polite"></div>
    <button class="btn ghost" id="more" hidden>Load older orders</button>
  </section>
  <div class="toast" id="toast" role="status"></div>
</div>
<script src="/assets/js/admin.js?v=1"></script>
</body>
</html>
