<body>
<div id="app">
  <main id="home" class="screen" aria-label="Shop">
    <header class="topbar gx" id="topbar">
      <button class="brand" id="brand" data-act="top" type="button" aria-label="House of Qi, back to top">
        <span class="mark" aria-hidden="true"></span>
        <span class="brand-txt"><span class="brand-name">House of Qi</span><span class="brand-sub">Crystals</span></span>
      </button>
      <nav class="dnav" id="dnav" aria-label="Collections"></nav>
      <div class="top-actions">
        <button class="icon-btn" data-act="search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg></button>
        <button class="icon-btn" id="bagBtn" data-act="bag" aria-label="View bag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" stroke-linecap="round"/></svg><span class="badge" id="badge">0</span></button>
      </div>
      <div class="search gx">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg><input id="q" type="search" placeholder="Search rose quartz, citrine, bracelet…" autocomplete="off" enterkeyhint="search"></label>
        <button class="cancel" data-act="searchClose">Cancel</button>
      </div>
    </header>
    <div id="homeBody"></div>
    <div id="results" class="gx" hidden></div>
  </main>

  <div id="dim" data-act="dimClose"></div>
  <section id="bag" class="screen push" hidden aria-label="Your bag">
    <header class="nav gx"><button class="icon-btn" data-act="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="nav-t">Shopping bag</span><span class="steps"><i class="on"></i><i></i></span></header>
    <div class="page gx" id="bagBody"></div>
    <div class="bottom gx"><button class="cta" id="toCheckout" data-act="toCheckout">Checkout</button></div>
  </section>

  <section id="checkout" class="screen push" hidden aria-label="Checkout">
    <header class="nav gx"><button class="icon-btn" data-act="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="nav-t">Checkout</span><span class="steps"><i class="on"></i><i class="on"></i></span></header>
    <div class="page gx" id="coBody"></div>
    <div class="bottom gx"><button class="cta hero" id="placeBtn" data-act="place"><span class="sheen"></span><span class="lbl">Continue to payment <i></i> <span class="p" id="placeAmt">RM0.00</span></span><span class="lbl3">Contact us on WhatsApp</span><span class="lbl2"><span class="spin"></span>Opening secure payment…</span></button></div>
  </section>


  <button class="cartbar" id="cartbar" data-act="bag" aria-label="View bag"><span class="cb-thumbs" id="cbThumbs"></span><span class="cb-info"><span class="cb-count" id="cbCount">0 items</span><span class="cb-total" id="cbTotal">RM0.00</span></span><span class="cb-go">View bag<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>

  <a class="wafab" id="wafab" href="#" target="_blank" rel="noopener" aria-label="Chat with House of Qi on WhatsApp" hidden><span class="wa-logo"></span><span class="wa-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.4 4.8 5-1.3A9.8 9.8 0 1 0 12 2.2Zm0 17.9c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.1 8.1 0 1 1 12 20.1Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg></span><span class="wa-tip">Chat with us</span></a>

  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Product details">
    <div class="sheet-scroll" id="sheetScroll">
      <div class="sheet-hero"><img id="shImg" alt=""><button type="button" class="sh-zoom" data-act="zoomOpen" aria-label="Zoom in on the photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M10.5 7.5v6M7.5 10.5h6"/></svg></button><div class="sh-th" id="shTh" hidden></div></div>
      <div class="sheet-body gx" id="shBody"></div>
    </div>
    <button class="sheet-close" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-cta gx">
      <div class="stepper" aria-label="Quantity"><button data-act="qDec" id="qDec" aria-label="Fewer"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button><output id="qOut">1</output><button data-act="qInc" aria-label="More"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F6834"/><stop offset=".35" stop-color="#D2AC6C"/><stop offset=".5" stop-color="#F1DCAA"/><stop offset=".7" stop-color="#C49A5B"/><stop offset="1" stop-color="#94703A"/></linearGradient></defs></svg>
