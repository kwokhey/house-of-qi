<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Print tags · House of Qi</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style id="pageSize"></style>
<style>
:root{--paper:#EFE0D4;--card:#F7EDE6;--ink:#2E221C;--ink-2:#6E5A4E;--ink-3:#9A8578;--line:rgba(59,44,35,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Jost,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:end}
.bar h1{font:500 28px Cormorant Garamond,serif;margin:0 12px 0 0}
.bar label{display:grid;gap:3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.bar select,.bar input[type=number]{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.bar .chk{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400}
.bar button{font:600 11px Jost;letter-spacing:.18em;text-transform:uppercase;padding:12px 20px;border-radius:999px;border:0;background:var(--ink);color:#F7EEE4;cursor:pointer}
.bar .sum{color:var(--ink-2);font-size:13px;margin-left:auto}
.tip{max-width:860px;margin:14px 20px 0;color:var(--ink-2);font-size:13px}
.msg{padding:40px 20px;color:var(--ink-2)}
#sheet{padding:20px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}

/* ---------- the tag (black only, so it prints well on thermal printers) ---------- */
.tag{background:#fff;color:#000;overflow:hidden;position:relative;font-family:Jost,Arial,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tag .brand{font:600 1.55mm/1 Jost,Arial,sans-serif;letter-spacing:.35em}
.tag .nm{font:600 3.3mm/1.08 "Cormorant Garamond",Georgia,serif;margin:1mm 0 .7mm;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag .dt{font-size:2.2mm;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .pr{font:600 4.4mm/1 Jost,Arial,sans-serif;letter-spacing:.01em}
.tag .id{font:500 2mm/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.tag .qr svg{display:block;width:100%;height:auto}
.tag .scan{font-size:1.45mm;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-top:.6mm}

/* label: text left, QR right */
.f-label{width:var(--w);height:var(--h);padding:2.2mm 2.4mm;display:grid;grid-template-columns:1fr var(--qr);gap:2mm}
.f-label .l{display:flex;flex-direction:column;min-width:0}
.f-label .bottom{margin-top:auto;display:flex;flex-direction:column;gap:1mm}
.f-label .r{display:flex;flex-direction:column;justify-content:center}
.f-label.noqr{grid-template-columns:1fr}
.f-label.small .nm{font-size:2.9mm}.f-label.small .pr{font-size:3.8mm}.f-label.small .dt{font-size:1.95mm}

/* wrap-around (rat-tail) bracelet tag: printed head + long blank tail */
.f-rt{width:calc(var(--w) + var(--t));height:var(--h);display:flex;align-items:center;background:transparent;box-shadow:none}
.f-rt .head{width:var(--w);height:var(--h);background:#fff;border-radius:1.6mm;padding:1.3mm 1.8mm 1.1mm;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.18);position:relative}
.f-rt .head::before{content:"";position:absolute;left:1.1mm;top:50%;width:1.3mm;height:1.3mm;margin-top:-.65mm;border-radius:50%;background:transparent}
.f-rt .tl{flex:1;height:calc(var(--h) * .3);background:#fff;border-radius:0 2mm 2mm 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.f-rt .nm{font-size:2.75mm;line-height:1.04;margin:0;-webkit-line-clamp:2}
.f-rt .row{display:flex;justify-content:space-between;align-items:baseline;gap:1mm}
.f-rt .dt{font-size:2.1mm;font-weight:500}
.f-rt .pr{font-size:3.5mm;white-space:nowrap}
.f-rt .id{font-size:1.75mm;letter-spacing:.06em}
.f-rt.small .head{padding:1mm 1.4mm .9mm}.f-rt.small .nm{font-size:2.3mm;-webkit-line-clamp:1}.f-rt.small .pr{font-size:3mm}.f-rt.small .dt{font-size:1.85mm}.f-rt.small .id{font-size:1.5mm}

/* dumbbell jewellery tag: two printable ends joined by a narrow middle; fold the middle around the bracelet */
.f-db{width:var(--L);height:var(--H);display:grid;grid-template-columns:var(--E) 1fr var(--E);background:transparent;box-shadow:none}
.f-db .half{background:#fff;border-radius:1.2mm;padding:1mm 1.5mm;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18);min-width:0;overflow:hidden}
.f-db .half.r2{align-items:center;text-align:center}
.f-db .tail{align-self:center;height:calc(var(--H) * .55);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.f-db .brand{font-size:1.25mm;letter-spacing:.3em}
.f-db .nm{font-size:calc(var(--H) * .19);line-height:1.04;margin:.4mm 0 .3mm;-webkit-line-clamp:2}
.f-db .dt{font-size:calc(var(--H) * .15);font-weight:500}
.f-db .pr{font-size:calc(var(--H) * .3)}
.f-db .id{font-size:calc(var(--H) * .13);margin-top:.8mm}
/* ZD421 jewellery tag 104 × 13 mm: two 32 mm panels side by side, then a 40 mm tail (blank) */
.f-zd{width:104mm;height:13mm;display:grid;grid-template-columns:32mm 32mm 40mm;background:transparent;box-shadow:none;color:#000}
.f-zd .p{background:#fff;padding:.9mm 1.6mm;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden;border-radius:1.2mm;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.f-zd .p2{align-items:center;text-align:center}
.f-zd .tail{align-self:center;height:3mm;background:#fff;border-radius:0 1.5mm 1.5mm 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.f-zd .brand{font:600 1.3mm/1 Jost,Arial,sans-serif;letter-spacing:.32em}
.f-zd .nm{font:600 2.7mm/1.02 Jost,Arial,sans-serif;margin:.5mm 0 .4mm;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.f-zd .dt{font:500 2.1mm/1.1 Jost,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-zd .pr{font:700 4.2mm/1 Jost,Arial,sans-serif}
.f-zd .id{font:600 1.9mm/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;margin-top:1mm}
.f-zd.nopr .id{font-size:2.6mm;margin:0}
.dbs{display:flex;gap:10px}.dbs[hidden]{display:none}.dbs input{width:84px}

/* A4: cut-out cards on a normal printer */
body.a4 #sheet{display:grid;grid-template-columns:repeat(3,63mm);gap:0;width:max-content;background:#fff;padding:10mm 10.5mm}
body.a4 .tag{box-shadow:none;outline:.2mm dashed #bbb;outline-offset:-.1mm}

@media print{
  body{background:#fff}
  .bar,.tip,.msg{display:none!important}
  #sheet{padding:0!important;gap:0!important;display:block}
  .tag{box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}
  body.roll .tag{page-break-after:always;break-after:page}
  body.roll .tag:last-child{page-break-after:auto;break-after:auto}
  body.a4 #sheet{display:grid!important;padding:0!important}
  body.a4 .tag{outline:.2mm dashed #999}
  .f-db .half,.f-db .tail,.f-zd .p,.f-zd .tail{box-shadow:none!important}
  .f-zd .tail{background:transparent}
  .f-rt .head,.f-rt .tl{box-shadow:none!important}
}
</style>
</head>
<body class="roll">
<div class="bar">
  <h1>Print tags</h1>
  <label>Tag size<select id="fmt">
    <option value="rtzd">Wrap-around tag · Zebra ZD421 (panel + tail, adjustable size)</option>
    <option value="zd104">Jewellery tag 104 × 13 mm · Zebra ZD421 (two 32 mm panels + tail)</option>
    <option value="db">Dumbbell tag (folds around the bracelet)</option>
    <option value="rt3015">Bracelet tag, wrap-around (30 × 15 mm + tail)</option>
    <option value="rt2512">Bracelet tag, wrap-around small (25 × 12 mm + tail)</option>
    <option value="5030">Label 50 × 30 mm (thermal printer)</option>
    <option value="4030">Label 40 × 30 mm (thermal printer)</option>
    <option value="a4">A4 paper, cut out (any printer)</option>
  </select></label>
  <span id="dbSize" class="dbs" hidden>
    <label>Total length (mm)<input type="number" id="dbL" min="30" max="120" step="1" value="72"></label>
    <label>Height (mm)<input type="number" id="dbH" min="8" max="30" step="0.5" value="13"></label>
    <label><span id="dbELbl">Each end (mm)</span><input type="number" id="dbE" min="10" max="50" step="1" value="25"></label>
  </span>
  <label>How many<select id="qty"><option value="1">1 per item</option><option value="stock">1 per piece in stock</option></select></label>
  <label>&nbsp;<span class="chk"><input type="checkbox" id="qrOn" checked> QR code</span></label>
  <label>&nbsp;<span class="chk"><input type="checkbox" id="prOn" checked> Price</span></label>
  <span class="sum" id="sum"></span>
  <button id="print">Print</button>
</div>
<p class="tip" id="tip"></p>
<div id="sheet"><p class="msg">Loading…</p></div>
<script src="/assets/js/qr.js?v=1"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const name = (i) => `${i.stone || ""} ${i.type || ""}`.trim() || i.id;
  const RM = (n) => "RM" + (Number(n) % 1 ? Number(n).toFixed(2) : Number(n).toLocaleString("en-MY"));
  const want = (new URLSearchParams(location.search).get("ids") || "").split(",").filter(Boolean);
  const FMT = {
    rt3015: { rt: 1, w: 30, h: 15, tail: 40, tip: "For wrap-around (rat-tail) jewellery tag rolls with a 30 × 15 mm head. Choose the label size your roll says (for example 70 × 15 mm, head plus tail), margins None, scale 100%. Wrap the tail round the bracelet and stick it to the back of the head." },
    rt2512: { rt: 1, w: 25, h: 12, tail: 40, small: 1, tip: "For wrap-around (rat-tail) tag rolls with a 25 × 12 mm head. Choose the label size your roll says (for example 65 × 12 mm), margins None, scale 100%." },
    "5030": { w: 50, h: 30, qr: 17, tip: "In your printer settings choose paper size 50 × 30 mm, margins None, scale 100%. One tag prints on each label." },
    "4030": { w: 40, h: 30, qr: 13, small: 1, tip: "In your printer settings choose paper size 40 × 30 mm, margins None, scale 100%. One tag prints on each label." },
    db: { tip: "Enter your roll's sizes (they're on the listing or the box). One end shows the stone and bead size, the other the price and item ID; fold the middle around the bracelet so the two ends stick back to back. In the print window choose that paper size, margins None, scale 100%." },
    rtzd: { tip: "Wrap-around jewellery tags on the Zebra ZD421 (panel on the left, thin tail on the right). Measure one label and set Total length, Height and Panel length; the starting values (95 × 12 mm, 50 mm panel) are an estimate. In the print window: printer ZD421, paper size = total length × height (create it once in the Zebra driver), margins None, scale 100%. Print 1 tag first to check." },
    zd104: { zd: 1, tip: "Zebra ZD421 with 104 × 13 mm tags (two 32 mm panels + 40 mm tail). In the print window: printer ZD421, paper size 104 × 13 mm (create it once in the Zebra driver as 4.09 × 0.51 in), margins None, scale 100%, no headers/footers. Front panel: name and bead size. Back panel: price and item ID. Wrap the tail round the bracelet and stick it behind the panels." },
    a4: { tip: "Prints 27 tags (63 × 30 mm) on A4 with dashed cut lines. Use thick paper (200–300 gsm card) or A4 sticker paper, margins None, scale 100%." },
  };
  let ITEMS = [];
  const settings = () => { try { return JSON.parse(localStorage.getItem("hq-tags") || "{}"); } catch { return {}; } };
  const keep = () => { try { localStorage.setItem("hq-tags", JSON.stringify({ fmt: $("#fmt").value, qty: $("#qty").value, qr: $("#qrOn").checked, pr: $("#prOn").checked, L: $("#dbL").value, H: $("#dbH").value, E: $("#dbE").value })); } catch {} };

  function tagHTML(i, f, o) {
    const size = i.size_mm ? `${+i.size_mm} mm` : "";
    const dt = [size, i.variant].filter(Boolean).join(" · ");
    const price = o.pr && i.price > 0 ? `<div class="pr">${RM(i.price)}</div>` : "";
    if (f === "rtzd" || FMT[f].rt) { const F = f === "rtzd" ? { w: o.E, h: o.H, tail: o.L - o.E, small: o.H < 12 } : FMT[f];
      return `<div class="tag f-rt${F.small ? " small" : ""}" style="--w:${F.w}mm;--h:${F.h}mm;--t:${F.tail}mm"><div class="head">
        <div class="nm">${esc(name(i))}</div><div class="row"><span class="dt">${esc(size || i.variant || "\u00a0")}</span>${price}</div><div class="id">${esc(i.id)}</div></div><div class="tl"></div></div>`; }
    if (f === "zd104") return `<div class="tag f-zd${o.pr && i.price > 0 ? "" : " nopr"}"><div class="p"><div class="brand">HOUSE OF QI</div><div class="nm">${esc(name(i))}</div><div class="dt">${esc(dt || "\u00a0")}</div></div>
      <div class="p p2">${price}<div class="id">${esc(i.id)}</div></div><div class="tail"></div></div>`;
    if (f === "db") return `<div class="tag f-db" style="--L:${o.L}mm;--H:${o.H}mm;--E:${o.E}mm"><div class="half"><div class="brand">HOUSE OF QI</div><div class="nm">${esc(name(i))}</div><div class="dt">${esc(size || i.variant || "")}</div></div><div class="tail"></div>
      <div class="half r2">${price}<div class="id">${esc(i.id)}</div></div></div>`;
    const F = FMT[f === "a4" ? "5030" : f];
    const qr = o.qr ? `<div class="r"><div class="qr">${QR.svg(`${location.origin}/p/${encodeURIComponent(i.id)}`, "M")}</div><div class="scan">Scan to shop</div></div>` : "";
    return `<div class="tag f-label${F.small ? " small" : ""}${o.qr ? "" : " noqr"}" style="--w:${f === "a4" ? 63 : F.w}mm;--h:${f === "a4" ? 30.5 : F.h}mm;--qr:${F.qr}mm">
      <div class="l"><div class="brand">HOUSE OF QI</div><div class="nm">${esc(name(i))}</div><div class="dt">${esc(dt)}</div>
      <div class="bottom">${price}<div class="id">${esc(i.id)}</div></div></div>${qr}</div>`;
  }

  function render() {
    const f = $("#fmt").value, o = { qr: $("#qrOn").checked && f !== "db" && f !== "zd104" && f !== "rtzd" && !FMT[f].rt, pr: $("#prOn").checked };
    const num = (k, d, a, b) => Math.min(b, Math.max(a, +$(k).value || d));
    if (f === "rtzd" && render.last !== "rtzd" && $("#dbL").value === "72" && $("#dbE").value === "25") { $("#dbL").value = 95; $("#dbH").value = 12; $("#dbE").value = 50; }
    render.last = f;
    o.L = num("#dbL", 72, 30, 120); o.H = num("#dbH", 13, 8, 30);
    o.E = f === "rtzd" ? Math.min(num("#dbE", 50, 15, 90), o.L - 10) : Math.min(num("#dbE", 25, 10, 50), (o.L - 6) / 2);
    $("#dbSize").hidden = f !== "db" && f !== "rtzd";
    $("#dbELbl").textContent = f === "rtzd" ? "Panel length (mm)" : "Each end (mm)";
    const noQR = f === "db" || f === "zd104" || f === "rtzd" || !!FMT[f].rt;
    $("#qrOn").disabled = noQR;
    document.body.className = f === "a4" ? "a4" : "roll";
    const F = FMT[f];
    $("#pageSize").textContent = f === "rtzd" ? `@page{size:${o.L}mm ${o.H}mm;margin:0}` : F.rt ? `@page{size:${F.w + F.tail}mm ${F.h}mm;margin:0}` : f === "a4" ? "@page{size:A4;margin:0}" : f === "zd104" ? "@page{size:104mm 13mm;margin:0}" : f === "db" ? `@page{size:${o.L}mm ${o.H}mm;margin:0}` : `@page{size:${F.w}mm ${F.h}mm;margin:0}`;
    $("#tip").textContent = F.tip;
    const list = [];
    for (const i of ITEMS) { const n = $("#qty").value === "stock" ? Math.max(0, i.stock) : 1; for (let k = 0; k < n; k++) list.push(i); }
    $("#sum").textContent = `${list.length} tag${list.length === 1 ? "" : "s"} · ${ITEMS.length} item${ITEMS.length === 1 ? "" : "s"}`;
    $("#sheet").innerHTML = list.length ? list.map((i) => tagHTML(i, f, o)).join("") : `<p class="msg">No tags to print. ${$("#qty").value === "stock" ? "These items have no stock." : ""}</p>`;
    keep();
  }

  async function load() {
    const r = await fetch("/api/admin/items", { credentials: "same-origin" });
    if (r.status === 401) { $("#sheet").innerHTML = `<p class="msg">Please <a href="/admin">log in to admin</a> first, then open Print tags again.</p>`; return; }
    const d = await r.json();
    const by = Object.fromEntries(d.items.map((i) => [i.id, i]));
    ITEMS = want.length ? want.map((id) => by[id]).filter(Boolean) : d.items.filter((i) => i.published && i.stock > 0);
    const s = settings();
    if (s.fmt) $("#fmt").value = s.fmt; if (s.qty) $("#qty").value = s.qty;
    if (s.L) $("#dbL").value = s.L; if (s.H) $("#dbH").value = s.H; if (s.E) $("#dbE").value = s.E;
    if (s.qr === false) $("#qrOn").checked = false; if (s.pr === false) $("#prOn").checked = false;
    render();
  }
  ["#fmt", "#qty", "#qrOn", "#prOn", "#dbL", "#dbH", "#dbE"].forEach((k) => $(k).addEventListener("change", render));
  $("#print").onclick = () => window.print();
  load().catch(() => ($("#sheet").innerHTML = `<p class="msg">Couldn't load the stock list. Please refresh.</p>`));
})();
</script>
</body>
</html>
